# ==========================================================================
# SAP FI Compass — GitHub Pages yayını
# --------------------------------------------------------------------------
# Ücretsiz ve alan adı gerektirmez. Yayın adresi:
#   https://narinygt.github.io/Default/
# Depo adı değiştirilirse adres de değişir (örn. .../sap-fi-compass/).
#
# Pages ayarı ELLE AÇILMAZ: configure-pages eylemi `enablement: true`
# ile Pages'i kendi yetkisiyle (permissions.pages: write) açar. İlk
# çalıştırmada siteyi oluşturur, sonrakilerde var olanı kullanır.
#
# Neden dosya kopyalanmıyor da SAPWeb/ klasörü yükleniyor: uygulama
# göreli yollarla çalışıyor (css/…, js/…) ve alt dizinden sunulmaya
# uygun. Hash tabanlı yönlendirme de sunucu ayarı istemiyor —
# file:// için seçilen tasarım burada da işe yarıyor.
# ==========================================================================
name: Pages

on:
  push:
    branches: [claude/website-theme-content-9jhptu]
    paths:
      - 'SAPWeb/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; sıradaki beklesin, çalışan iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Yayına girmeden önce iki temel kontrol: uygulama gerçekten
      # kendi kendine yetiyor mu?
      - name: Kendine yeterlilik kontrolü
        run: |
          test -f SAPWeb/index.html
          if grep -rniE '(src|href)="https?://' SAPWeb/index.html; then
            echo "::error::index.html harici kaynağa bağlanıyor — çevrimdışı kuralı bozuk."
            exit 1
          fi
          echo "harici kaynak yok"

      - uses: actions/configure-pages@v5
        with:
          # Pages kapalıysa AÇAR. Bu olmadan ilk çalıştırma
          # "Get Pages site failed / Not Found" ile düşüyordu.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SAPWeb
      - id: deployment
        uses: actions/deploy-pages@v4
