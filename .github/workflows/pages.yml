# ==========================================================================
# SAP FI Compass — GitHub Pages yayını
# --------------------------------------------------------------------------
# Ücretsiz ve alan adı gerektirmez. Yayın adresi:
#   https://narinygt.github.io/Default/
# Depo adı değiştirilirse adres de değişir (örn. .../sap-fi-compass/).
#
# ⚠️ TEK SEFERLİK ELLE AYAR GEREKİR — ve bunun neden kaçınılmaz olduğu
# denenerek saptandı:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# `enablement: true` denendi; eylem Pages sitesini API'den açmaya
# çalışıyor ama şununla düşüyor:
#   "Create Pages site failed. Resource not accessible by integration"
# Sebep: Pages sitesi OLUŞTURMAK depo üzerinde `administration: write`
# ister; iş akışına verilen GITHUB_TOKEN'da bu yetki yok ve
# `permissions:` bloğundan da istenemez. `pages: write` yalnızca
# DAĞITIM içindir, siteyi kurmak için değil.
#
# Parametre yine de `true` bırakıldı: Pages bir kez elle açıldıktan
# sonra eylem var olan siteyi buluyor ve bu satır zararsız kalıyor.
#
# Neden dosya kopyalanmıyor da SAPWeb/ klasörü yükleniyor: uygulama
# göreli yollarla çalışıyor (css/…, js/…) ve alt dizinden sunulmaya
# uygun. Hash tabanlı yönlendirme de sunucu ayarı istemiyor —
# file:// için seçilen tasarım burada da işe yarıyor.
# ==========================================================================
name: Pages

on:
  push:
    branches: [claude/website-theme-content-9jhptu]
    paths:
      - 'SAPWeb/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; sıradaki beklesin, çalışan iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Yayına girmeden önce iki temel kontrol: uygulama gerçekten
      # kendi kendine yetiyor mu?
      - name: Kendine yeterlilik kontrolü
        run: |
          test -f SAPWeb/index.html
          if grep -rniE '(src|href)="https?://' SAPWeb/index.html; then
            echo "::error::index.html harici kaynağa bağlanıyor — çevrimdışı kuralı bozuk."
            exit 1
          fi
          echo "harici kaynak yok"

      - uses: actions/configure-pages@v5
        with:
          # Pages kapalıysa AÇAR. Bu olmadan ilk çalıştırma
          # "Get Pages site failed / Not Found" ile düşüyordu.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: SAPWeb
      - id: deployment
        uses: actions/deploy-pages@v4
