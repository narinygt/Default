<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SAP FI Compass — S/4HANA Finansal Muhasebe: iş süreci, muhasebe mantığı, işlem kodları, tablolar ve S/4HANA yenilikleri.">
<title>SAP FI Compass</title>
<!-- Sekme simgesi: T-hesap. Gömülü SVG — harici dosya yok,
     çevrimdışı kuralı korunuyor (Kural #5). -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23FBFAF7"/><path d="M7 11h18M16 11v14" fill="none" stroke="%231F5C4A" stroke-width="2.6" stroke-linecap="round"/></svg>'>

<!-- Tema, kabuk ve yazdırma stilleri. Harici font/CDN yok: internetsiz de aynı görünür. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css">

<!-- Sayfa boyanmadan temayı uygula: karanlık modda beyaz parlama olmasın. -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('sapfi_v1') || '{}');
    var t = s.theme || (window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* özel sekme — varsayılan aydınlık tema ile devam */ }
})();
</script>
</head>

<body>

<div class="shell">
  <!-- Kenar çubuğu içeriğini ui.js her render'da tazeler -->
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim" data-action="close-menu"></div>

  <div class="main">
    <!-- Üst çubuk: konum + arama + dil + tema. Buradaki ikonlar Lucide'dir
         (16px, 1.5 kalınlık, currentColor) ve ui.js tarafından basılır.
         EMOJİ YOK — bkz. theme.css ilke 5. -->
    <header class="topbar">
      <button class="iconbtn menubtn" id="menu-btn" type="button" data-action="toggle-menu"></button>
      <nav class="topbar-crumb" id="crumb" aria-label="Konum"></nav>
      <span class="topbar-spacer"></span>
      <button class="searchbtn" id="search-btn" type="button" data-action="open-search"></button>
      <!-- Dil anahtarı — sağ üst köşe. `hidden` niteliği burada yalnızca
           İLK BOYAMADA yanıp sönmeyi önler; ui.js her render'da
           SAP.i18n.anahtarAcik'e göre gerçek durumu yazar (js/i18n.js). -->
      <div class="langsw" id="langsw" role="group" aria-label="Language" hidden></div>
      <button class="iconbtn" type="button" id="theme-btn" data-action="toggle-theme"></button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- ==========================================================================
     Yükleme sırası önemlidir ve ES module DEĞİLDİR.
     file:// altında import/export CORS'a takıldığı için tüm dosyalar klasik
     <script src> ile yüklenir ve global SAP nesnesine kayıt olur.

       1) çekirdek      core → markup → diagram
       2) veri          sözlükler → katalog (33+ konu stub'ı)
       3) içerik        content/fi/*.js — stub'ları derin bölümlerle doldurur
       4) arayüz        sections → views → learn → search → ui (ui boot() çağırır)

     YENİ KONU EKLEMEK: content/fi/ altına dosya + aşağıya tek satır <script>.
     Başka hiçbir yeri değiştirmek gerekmez.
     ========================================================================== -->
